<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>THE SALON — Welcome Signage (24in × 36in)</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<style>
  /*
    Large-format entrance sign, 24in x 36in portrait, freestanding or
    easel-mounted at the door. Ink-on-white, matching the printed
    collateral family (as opposed to the projected slides, which
    invert to blue). The comb appears large and centered here —
    one of the two places in this system where that scale is
    explicitly appropriate.
  */
  @page { size: 24in 36in; margin: 0; }
  html, body {
    width: 100vw;
    height: 100vh;
    background: var(--color-white);
    overflow: hidden;
  }
  .sign {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 7vh 8vw;
    color: var(--color-blue);
    text-align: center;
  }
  .top {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.2vh;
  }
  .title {
    font-family: var(--font-display);
    font-weight: 400;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-size: 6.4vw;
    line-height: 1;
    margin: 0;
  }
  .convened {
    font-family: var(--font-text);
    font-weight: 400;
    font-size: 1.7vw;
    letter-spacing: 0.02em;
    margin: 0;
  }
  .comb-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .comb {
    width: 26vw;
    color: var(--color-blue);
  }
  .bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2vh;
  }
  .rule {
    width: 5vw;
    height: 1px;
    background: currentColor;
    opacity: 0.4;
  }
  .date-line {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 2vw;
    margin: 0;
  }
  .place-line {
    font-family: var(--font-text);
    font-size: 1.3vw;
    letter-spacing: 0.02em;
    margin: 0;
  }
  .invite-only {
    font-family: var(--font-text);
    font-size: 1vw;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    opacity: 0.65;
    margin-top: 1vh;
  }
</style>
</head>
<body>
  <div class="sign">
    <div class="top">
      <h1 class="title">THE SALON</h1>
      <p class="convened">Convened by Bluemind Foundation</p>
    </div>

    <div class="comb-wrap">
      <svg class="comb" viewBox="0 0 240 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="THE SALON comb symbol (placeholder)">
        <g fill="currentColor">
          <rect x="20" y="30" width="200" height="24" rx="12"/>
          <path d="M24.11,54 L28.11,297 A3,3 0 0 0 34.11,297 L38.11,54 Z"/>
          <path d="M46.33,54 L50.33,297 A3,3 0 0 0 56.33,297 L60.33,54 Z"/>
          <path d="M68.56,54 L72.56,297 A3,3 0 0 0 78.56,297 L82.56,54 Z"/>
          <path d="M90.78,54 L94.78,297 A3,3 0 0 0 100.78,297 L104.78,54 Z"/>
          <path d="M113.00,54 L117.00,297 A3,3 0 0 0 123.00,297 L127.00,54 Z"/>
          <path d="M135.22,54 L139.22,297 A3,3 0 0 0 145.22,297 L149.22,54 Z"/>
          <path d="M157.44,54 L161.44,297 A3,3 0 0 0 167.44,297 L171.44,54 Z"/>
          <path d="M179.67,54 L183.67,297 A3,3 0 0 0 189.67,297 L193.67,54 Z"/>
          <path d="M201.89,54 L205.89,297 A3,3 0 0 0 211.89,297 L215.89,54 Z"/>
        </g>
      </svg>
    </div>

    <div class="bottom">
      <div class="rule"></div>
      <p class="date-line">September 17, 2026</p>
      <p class="place-line">New York — 81st UN General Assembly</p>
      <p class="invite-only">By Invitation Only</p>
    </div>
  </div>
</body>
</html>
