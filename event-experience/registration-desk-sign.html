<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>THE SALON — Registration Desk Sign (18in × 24in)</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<style>
  /*
    Desk-facing sign, 18in x 24in portrait, propped behind the
    registration table at eye level. Quieter than the entrance
    sign: a small corner comb mark rather than a large centered one.
  */
  @page { size: 18in 24in; margin: 0; }
  html, body {
    width: 100vw;
    height: 100vh;
    background: var(--color-white);
    overflow: hidden;
  }
  .sign {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3.4vh;
    color: var(--color-blue);
    text-align: center;
    position: relative;
    padding: 8vh 8vw;
  }
  .welcome {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: 4vw;
    margin: 0;
  }
  .rule {
    width: 4.5vw;
    height: 1px;
    background: currentColor;
    opacity: 0.4;
  }
  .title {
    font-family: var(--font-display);
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 4.6vw;
    margin: 0;
  }
  .sub {
    font-family: var(--font-text);
    font-size: 1.4vw;
    letter-spacing: 0.02em;
    margin: 0;
    opacity: 0.85;
  }
  .corner-mark {
    position: absolute;
    bottom: 6vh;
    right: 6vw;
    width: 2.4vw;
    color: var(--color-blue);
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="sign">
    <p class="welcome">Welcome</p>
    <div class="rule"></div>
    <h1 class="title">THE SALON</h1>
    <p class="sub">Convened by Bluemind Foundation</p>

    <svg class="corner-mark" viewBox="0 0 240 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
      <g fill="currentColor">
        <rect x="20" y="30" width="200" height="24" rx="12"/>
        <path d="M24.11,54 L28.11,297 A3,3 0 0 0 34.11,297 L38.11,54 Z"/>
        <path d="M46.33,54 L50.33,297 A3,3 0 0 0 56.33,297 L60.33,54 Z"/>
        <path d="M68.56,54 L72.56,297 A3,3 0 0 0 78.56,297 L82.56,54 Z"/>
        <path d="M90.78,54 L94.78,297 A3,3 0 0 0 100.78,297 L104.78,54 Z"/>
        <path d="M113.00,54 L117.00,297 A3,3 0 0 0 123.00,297 L127.00,54 Z"/>
        <path d="M135.22,54 L139.22,297 A3,3 0 0 0 145.22,297 L149.22,54 Z"/>
        <path d="M157.44,54 L161.44,297 A3,3 0 0 0 167.44,297 L171.44,54 Z"/>
        <path d="M179.67,54 L183.67,297 A3,3 0 0 0 189.67,297 L193.67,54 Z"/>
        <path d="M201.89,54 L205.89,297 A3,3 0 0 0 211.89,297 L215.89,54 Z"/>
      </g>
    </svg>
  </div>
</body>
</html>
