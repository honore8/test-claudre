<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>THE SALON — Partner Acknowledgement Slide</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<style>
  /*
    Template shows the eyebrow plus a single partner-name placeholder,
    and — commented out below — a second placeholder stacked with a
    generous vertical gap, to demonstrate how additional partners should
    be added if ever needed: stacked, never as a logo grid or wall.
  */
  @page { size: 1920px 1080px; margin: 0; }
  html, body {
    width: 100vw;
    height: 100vh;
    background: var(--color-blue);
    overflow: hidden;
  }
  .slide {
    width: 100vw;
    height: 100vh;
    background: var(--color-blue);
    color: var(--color-white);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6vh;
  }
  .eyebrow {
    color: var(--color-white);
    opacity: 0.72;
    font-size: 1.1vw;
  }
  .partners {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9vh; /* generous vertical space between any stacked partner names */
  }
  .partner-name {
    font-family: var(--font-display);
    font-weight: 500;
    letter-spacing: var(--tracking-display);
    font-size: 3.2vw;
    margin: 0;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="slide">
    <p class="eyebrow">Founding Cultural Partners</p>
    <div class="partners">
      <p class="partner-name">[Partner Name / Wordmark]</p>
      <!--
        If a second partner must appear on this slide, repeat the
        .partner-name block below — never place two names side by side
        or in a grid; keep the same generous vertical gap between them.

        <p class="partner-name">[Partner Name / Wordmark]</p>
      -->
    </div>
  </div>
</body>
</html>
