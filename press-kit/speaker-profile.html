<!--
  Photography is not yet in scope for this system. No photo slot is
  included in this template. Once photography is approved for THE
  SALON, this profile should gain a portrait slot using the design
  system's documented duotone-portrait treatment (see design-system
  notes / whichever workstream owns photographic treatment) rather
  than a plain photo — consistent with the "no photography, no
  gradients/glossy effects" brief this template currently honors.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>THE SALON — Speaker Profile Template (US Letter)</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<style>
  @page { size: 8.5in 11in; margin: 0; }
  html, body {
    width: 100vw;
    height: 100vh;
    background: var(--color-white);
    overflow: hidden;
  }
  .page {
    width: 100vw;
    height: 100vh;
    box-sizing: border-box;
    padding: 7vh 9vw;
    color: var(--color-blue);
    display: flex;
    flex-direction: column;
  }
  .eyebrow {
    color: var(--color-blue);
    opacity: 0.65;
    margin-bottom: 2.4vh;
  }
  .name {
    font-family: var(--font-display);
    font-weight: 500;
    letter-spacing: var(--tracking-display);
    font-size: 4.4vw;
    margin: 0;
    line-height: 1.05;
  }
  .role {
    font-family: var(--font-text);
    font-weight: 400;
    font-size: 1.35vw;
    margin: 1.6vh 0 0;
    opacity: 0.85;
  }
  .org {
    font-family: var(--font-text);
    font-weight: 500;
    font-size: 1.05vw;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    margin: 0.6vh 0 0;
    opacity: 0.6;
  }
  .rule {
    width: 3.6vw;
    height: 1px;
    background: currentColor;
    opacity: 0.35;
    margin: 4vh 0;
  }
  .bio-label {
    font-family: var(--font-text);
    font-weight: 600;
    font-size: 1.05vw;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    opacity: 0.55;
    margin: 0 0 1.6vh;
  }
  .bio-area {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: 1.5vw;
    line-height: 1.75;
    color: var(--color-blue);
    opacity: 0.85;
    max-width: 46vw;
    min-height: 22vh; /* approximate text-safe zone for a 100-150 word bio at this size */
    padding: 2vh 2vw;
    box-sizing: border-box;
    border: 1px dashed color-mix(in srgb, currentColor 35%, transparent);
  }
  .footer {
    margin-top: auto;
    padding-top: 3vh;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .footer p {
    font-family: var(--font-text);
    font-size: 0.95vw;
    letter-spacing: 0.02em;
    opacity: 0.6;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="page">
    <p class="eyebrow">Speaker</p>
    <h1 class="name">[Speaker Name]</h1>
    <p class="role">[Role / Title]</p>
    <p class="org">[Organization]</p>

    <div class="rule"></div>

    <p class="bio-label">Biography</p>
    <p class="bio-area">[BIO — 100–150 words]</p>

    <div class="footer">
      <p>THE SALON — Press Kit</p>
      <p>September 17, 2026 — New York</p>
    </div>
  </div>
</body>
</html>
