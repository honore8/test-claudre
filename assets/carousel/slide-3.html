<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 3 — The Program</title>
<link rel="stylesheet" href="carousel.css">
<style>
  .slide { justify-content: center; }

  .wrap {
    display: flex;
    flex-direction: column;
    gap: var(--space-6);
  }

  .heading {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 52px;
    margin: 0;
  }

  .acts {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .act {
    display: grid;
    grid-template-columns: 140px 1fr;
    align-items: baseline;
    padding: var(--space-4) 0;
  }

  .act + .act { border-top: var(--border-hairline); }

  .act-label {
    font-family: var(--font-text);
    text-transform: uppercase;
    letter-spacing: var(--tracking-label);
    font-weight: 500;
    font-size: 15px;
    color: var(--color-blue);
    opacity: 0.6;
  }

  .act-title {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 26px;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="wrap">
      <p class="eyebrow-lg">The Program</p>
      <h2 class="heading">Three Acts.</h2>

      <div class="acts">
        <div class="act">
          <span class="act-label">Act I</span>
          <p class="act-title">The Evidence</p>
        </div>
        <div class="act">
          <span class="act-label">Act II</span>
          <p class="act-title">From Evidence to Infrastructure</p>
        </div>
        <div class="act">
          <span class="act-label">Act III</span>
          <p class="act-title">La Clairière</p>
        </div>
      </div>
    </div>

    <div class="slide-mark">The Salon</div>
    <div class="slide-index">03 / 07</div>
  </div>
</body>
</html>
