<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 7 — Closing CTA</title>
<link rel="stylesheet" href="carousel.css">
<style>
  .slide { justify-content: center; text-align: center; align-items: center; }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-6);
  }

  .name {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 40px;
    line-height: 1.3;
    margin: 0;
  }

  .details {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-2);
  }

  .details p {
    font-family: var(--font-text);
    font-weight: 400;
    font-size: 22px;
    margin: 0;
  }

  .cta-line {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: 26px;
    margin: 0;
  }

  .cta-button {
    font-family: var(--font-text);
    text-transform: uppercase;
    letter-spacing: var(--tracking-label);
    font-weight: 500;
    font-size: 15px;
    color: var(--color-blue);
    border: var(--border-hairline);
    padding: var(--space-3) var(--space-5);
    background: none;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="wrap">
      <p class="name">THE SALON<br>by Bluemind Foundation</p>

      <div class="details">
        <p>September 17, 2026.</p>
        <p>New York.</p>
        <p>By invitation.</p>
      </div>

      <div class="rule" style="width:48px;"></div>

      <p class="cta-line">Interested in attending?</p>
      <div class="cta-button">Request an Invitation</div>
    </div>

    <div class="slide-mark">The Salon</div>
    <div class="slide-index">07 / 07</div>
  </div>
</body>
</html>
