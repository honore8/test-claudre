<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 5 — Act II</title>
<link rel="stylesheet" href="carousel.css">
<style>
  .slide { justify-content: center; }

  .wrap {
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
  }

  .heading {
    font-family: var(--font-display);
    font-weight: 400;
    letter-spacing: 0.01em;
    font-size: 58px;
    line-height: 1.1;
    text-transform: uppercase;
    margin: 0;
    max-width: 820px;
  }

  /* Architectural motif: three nested framing brackets, suggesting
     systems built at increasing scale — pure line geometry, no
     photography, no gradients, no panel iconography. */
  .motif { width: 100%; height: 120px; }

  .question {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: 34px;
    line-height: 1.35;
    margin: 0;
    max-width: 720px;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="wrap">
      <p class="eyebrow-lg">Act II</p>
      <h2 class="heading">From Evidence to Infrastructure</h2>

      <svg class="motif" viewBox="0 0 720 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="none" stroke="#14274E" stroke-width="1.5">
          <!-- innermost bracket -->
          <path d="M 300 40 L 300 20 L 320 20" opacity="0.9"/>
          <path d="M 420 20 L 440 20 L 440 40" opacity="0.9"/>
          <!-- middle bracket -->
          <path d="M 220 80 L 220 40 L 260 40" opacity="0.6"/>
          <path d="M 460 40 L 500 40 L 500 80" opacity="0.6"/>
          <!-- outer bracket -->
          <path d="M 100 110 L 100 60 L 180 60" opacity="0.35"/>
          <path d="M 540 60 L 620 60 L 620 110" opacity="0.35"/>
          <line x1="100" y1="110" x2="620" y2="110" opacity="0.35"/>
        </g>
      </svg>

      <p class="question">How do we build mental health systems people already trust?</p>
    </div>

    <div class="slide-mark">The Salon</div>
    <div class="slide-index">05 / 07</div>
  </div>
</body>
</html>
