<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE SALON — Speaker Announcement Template</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<!--
  Speaker & Founding Partner Announcement Visual Approach — Once photography
  becomes appropriate (post speaker confirmation), maintain restraint: a
  single subject, tightly cropped portrait (shoulders-up), shot against a
  plain, unstyled backdrop (soft ivory or Bluemind Blue seamless paper — no
  environmental or office backgrounds), converted to a two-tone duotone
  treatment in Bluemind Blue and white (or Bluemind Blue and soft ivory)
  rather than full color. The comb glyph may appear as a small fixed
  eyebrow mark near, never overlapping, the face. Pair with the person's
  name and one-line role set in the display serif, and an "ANNOUNCING"
  eyebrow label in tracked-caps sans. No drop shadows, no saturated color
  blocks behind the portrait, no grids of multiple partner logos — one
  subject or one mark at a time, same generous margins as everything else
  in the system.

  SWAP INSTRUCTIONS: replace the bracketed placeholder text below
  ([SPEAKER NAME], [ROLE / TITLE], [ORGANIZATION]) without touching layout,
  classes, or the .portrait-placeholder block. Once a duotone portrait is
  ready, replace the contents of .portrait-placeholder with the image
  (object-fit: cover; keep the same width/height/position) and delete the
  placeholder label text and dashed outline.
-->
</head>
<body>
<style>
  html, body { width: 1080px; height: 1080px; background: var(--color-white); overflow: hidden; }
  .frame {
    position: relative;
    width: 1080px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 96px;
  }
  .corner-comb {
    position: absolute;
    top: 64px;
    left: 64px;
    width: 40px;
    color: var(--color-blue);
  }
  .eyebrow {
    color: var(--color-blue);
    margin: 0 0 28px;
  }
  .portrait-placeholder {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    border: 1px dashed var(--color-blue);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 0 40px;
    opacity: 0.55;
  }
  .portrait-placeholder span {
    font-family: var(--font-text);
    font-size: 11px;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--color-blue);
    max-width: 160px;
    line-height: 1.6;
  }
  .name {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 56px;
    color: var(--color-blue);
    margin: 0 0 14px;
    letter-spacing: var(--tracking-display);
  }
  .role {
    font-family: var(--font-text);
    font-size: 17px;
    color: var(--color-blue);
    opacity: 0.8;
    margin: 0;
    max-width: 560px;
    line-height: 1.6;
  }
  .footer {
    position: absolute;
    bottom: 64px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: var(--font-text);
    font-size: 12px;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--color-blue);
    opacity: 0.6;
  }
</style>

  <div class="frame">
    <svg class="corner-comb" viewBox="0 0 240 320" role="img" aria-label="THE SALON comb symbol (placeholder)">
      <g fill="currentColor">
        <rect x="20" y="30" width="200" height="24" rx="12"/>
        <path d="M24.11,54 L28.11,297 A3,3 0 0 0 34.11,297 L38.11,54 Z"/>
        <path d="M46.33,54 L50.33,297 A3,3 0 0 0 56.33,297 L60.33,54 Z"/>
        <path d="M68.56,54 L72.56,297 A3,3 0 0 0 78.56,297 L82.56,54 Z"/>
        <path d="M90.78,54 L94.78,297 A3,3 0 0 0 100.78,297 L104.78,54 Z"/>
        <path d="M113.00,54 L117.00,297 A3,3 0 0 0 123.00,297 L127.00,54 Z"/>
        <path d="M135.22,54 L139.22,297 A3,3 0 0 0 145.22,297 L149.22,54 Z"/>
        <path d="M157.44,54 L161.44,297 A3,3 0 0 0 167.44,297 L171.44,54 Z"/>
        <path d="M179.67,54 L183.67,297 A3,3 0 0 0 189.67,297 L193.67,54 Z"/>
        <path d="M201.89,54 L205.89,297 A3,3 0 0 0 211.89,297 L215.89,54 Z"/>
      </g>
    </svg>

    <p class="eyebrow">Announcing</p>

    <!-- PORTRAIT PLACEHOLDER — see HTML comment above for the approved future treatment -->
    <div class="portrait-placeholder">
      <span>Portrait Placeholder<br>Duotone, Shoulders-Up</span>
    </div>

    <h1 class="name">[SPEAKER NAME]</h1>
    <p class="role">[ROLE / TITLE], [ORGANIZATION]</p>

    <p class="footer">THE SALON — September 17, 2026</p>
  </div>
</body>
</html>
