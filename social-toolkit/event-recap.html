<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE SALON — Event Recap / Thank You Template</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<!--
  SWAP INSTRUCTIONS: this template is designed to be reused after future
  editions with no factual claims baked in that would need rewriting.
  Replace [EVENT NAME] and [DATE] in the footer line only; the headline
  ("Thank You") and supporting line are intentionally generic and durable.
-->
</head>
<body>
<style>
  html, body { width: 1080px; height: 1080px; background: var(--color-white); overflow: hidden; }
  .frame {
    position: relative;
    width: 1080px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 96px;
  }
  .headline {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 72px;
    color: var(--color-blue);
    margin: 0 0 48px;
    letter-spacing: var(--tracking-display);
  }
  .comb {
    width: 150px;
    color: var(--color-blue);
    margin-bottom: 48px;
  }
  .supporting {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 22px;
    color: var(--color-blue);
    max-width: 600px;
    line-height: 1.5;
    margin: 0;
  }
  .footer {
    position: absolute;
    bottom: 64px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: var(--font-text);
    font-size: 13px;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--color-blue);
    opacity: 0.65;
  }
</style>

  <div class="frame">
    <h1 class="headline">Thank You</h1>

    <svg class="comb" viewBox="0 0 240 320" role="img" aria-label="THE SALON comb symbol (placeholder)">
      <g fill="currentColor">
        <rect x="20" y="30" width="200" height="24" rx="12"/>
        <path d="M24.11,54 L28.11,297 A3,3 0 0 0 34.11,297 L38.11,54 Z"/>
        <path d="M46.33,54 L50.33,297 A3,3 0 0 0 56.33,297 L60.33,54 Z"/>
        <path d="M68.56,54 L72.56,297 A3,3 0 0 0 78.56,297 L82.56,54 Z"/>
        <path d="M90.78,54 L94.78,297 A3,3 0 0 0 100.78,297 L104.78,54 Z"/>
        <path d="M113.00,54 L117.00,297 A3,3 0 0 0 123.00,297 L127.00,54 Z"/>
        <path d="M135.22,54 L139.22,297 A3,3 0 0 0 145.22,297 L149.22,54 Z"/>
        <path d="M157.44,54 L161.44,297 A3,3 0 0 0 167.44,297 L171.44,54 Z"/>
        <path d="M179.67,54 L183.67,297 A3,3 0 0 0 189.67,297 L193.67,54 Z"/>
        <path d="M201.89,54 L205.89,297 A3,3 0 0 0 211.89,297 L215.89,54 Z"/>
      </g>
    </svg>

    <p class="supporting">Where Relationships Become Infrastructure.</p>

    <p class="footer">[EVENT NAME] — [DATE]</p>
  </div>
</body>
</html>
