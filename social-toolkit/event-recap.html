<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE SALON — Event Recap / Thank You Template</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<!--
  SWAP INSTRUCTIONS: this template is designed to be reused after future
  editions with no factual claims baked in that would need rewriting.
  Replace [EVENT NAME] and [DATE] in the footer line only; the headline
  ("Thank You") and supporting line are intentionally generic and durable.
-->
</head>
<body>
<style>
  html, body { width: 1080px; height: 1080px; background: var(--color-white); overflow: hidden; }
  .frame {
    position: relative;
    width: 1080px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 96px;
  }
  .headline {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 72px;
    color: var(--color-blue);
    margin: 0 0 48px;
    letter-spacing: var(--tracking-display);
  }
  .comb {
    width: 150px;
    color: var(--color-blue);
    margin-bottom: 48px;
  }
  .supporting {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 22px;
    color: var(--color-blue);
    max-width: 600px;
    line-height: 1.5;
    margin: 0;
  }
  .footer {
    position: absolute;
    bottom: 64px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: var(--font-text);
    font-size: 13px;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--color-blue);
    opacity: 0.65;
  }
</style>

  <div class="frame">
    <h1 class="headline">Thank You</h1>

    <img class="comb" src="../design-system/comb-placeholder.svg" alt="">

    <p class="supporting">Where Relationships Become Infrastructure.</p>

    <p class="footer">[EVENT NAME] — [DATE]</p>
  </div>
</body>
</html>
