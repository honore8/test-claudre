<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE SALON — Save the Date</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<style>
  @page { size: 1200px 1500px; margin: 0; }
  html, body {
    width: 1200px;
    height: 1500px;
    background: var(--color-white);
    overflow: hidden;
  }
  .card {
    width: 1200px;
    height: 1500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 130px 100px 110px;
    text-align: center;
  }
  .top {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .eyebrow {
    color: var(--color-blue);
  }
  .event-name {
    font-family: var(--font-display);
    letter-spacing: 0.06em;
    font-weight: 500;
    font-size: 44px;
    color: var(--color-blue);
    margin: 0;
  }
  .convened {
    font-family: var(--font-text);
    font-size: 15px;
    font-weight: 400;
    color: var(--color-blue);
    letter-spacing: 0.02em;
    max-width: 560px;
    line-height: 1.6;
    margin: 0;
  }
  .comb {
    width: 130px;
    color: var(--color-blue);
  }
  .middle {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .tagline {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: 27px;
    color: var(--color-blue);
    max-width: 620px;
    line-height: 1.45;
    margin: 0;
  }
  .bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .date-line {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 500;
    color: var(--color-blue);
    margin: 0;
  }
  .city-line {
    font-family: var(--font-text);
    font-size: 15px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-blue);
    margin: 0;
  }
  .invite-only {
    font-family: var(--font-text);
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-blue);
    opacity: 0.72;
    margin-top: 30px;
  }
  hr.rule {
    border: none;
    border-top: var(--border-hairline);
    color: var(--color-blue);
    width: 64px;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <p class="eyebrow">Save the Date</p>
      <h1 class="event-name">THE SALON</h1>
      <p class="convened">Convened by Bluemind Foundation.<br>Shaped by Africa. Open to the World.</p>
    </div>

    <div class="middle">
      <svg class="comb" viewBox="0 0 240 320" role="img" aria-label="THE SALON comb symbol (placeholder)">
      <g fill="currentColor">
        <rect x="20" y="30" width="200" height="24" rx="12"/>
        <path d="M24.11,54 L28.11,297 A3,3 0 0 0 34.11,297 L38.11,54 Z"/>
        <path d="M46.33,54 L50.33,297 A3,3 0 0 0 56.33,297 L60.33,54 Z"/>
        <path d="M68.56,54 L72.56,297 A3,3 0 0 0 78.56,297 L82.56,54 Z"/>
        <path d="M90.78,54 L94.78,297 A3,3 0 0 0 100.78,297 L104.78,54 Z"/>
        <path d="M113.00,54 L117.00,297 A3,3 0 0 0 123.00,297 L127.00,54 Z"/>
        <path d="M135.22,54 L139.22,297 A3,3 0 0 0 145.22,297 L149.22,54 Z"/>
        <path d="M157.44,54 L161.44,297 A3,3 0 0 0 167.44,297 L171.44,54 Z"/>
        <path d="M179.67,54 L183.67,297 A3,3 0 0 0 189.67,297 L193.67,54 Z"/>
        <path d="M201.89,54 L205.89,297 A3,3 0 0 0 211.89,297 L215.89,54 Z"/>
      </g>
    </svg>
      <p class="tagline">Where Relationships<br>Become Infrastructure.</p>
    </div>

    <div class="bottom">
      <hr class="rule">
      <p class="date-line">September 17, 2026</p>
      <p class="city-line">New York — 81st UN General Assembly</p>
      <p class="invite-only">By Invitation Only</p>
    </div>
  </div>
</body>
</html>
